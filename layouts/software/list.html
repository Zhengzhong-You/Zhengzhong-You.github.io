{{- define "main" }}
<header class="page-header"><h1>{{ .Title }}</h1></header>
<ol class="compact-cv-list">
  {{- range .RegularPages.ByDate.Reverse }}
  <li class="compact-cv-item">
    <div class="compact-cv-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></div>
    {{- with .Params.summary }}<p class="compact-cv-details">{{ . | plainify | htmlUnescape }}</p>{{ end }}
  </li>
  {{- end }}
</ol>
{{- end }}
