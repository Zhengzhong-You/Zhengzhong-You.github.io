{{- define "main" }}

<header class="page-header">
    <h1>{{ .Title }}</h1>
</header>

<ul class="terms-tags">
    {{- $type := .Type }}
    {{- range $key, $value := .Data.Terms.Alphabetical }}
    {{- $name := .Name }}
    {{- $count := .Count }}
    {{- with site.GetPage (printf "/%s/%s" $type $name) }}
    <li>
        <a href="{{ .Permalink }}">{{ .LinkTitle }} <span class="term-count">{{ $count }}</span></a>
    </li>
    {{- end }}
    {{- end }}
</ul>

{{- end }}
